name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ./CodexApiBridge.csproj

      - name: Build
        run: dotnet build ./CodexApiBridge.csproj --configuration Release --no-restore

  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            archive: CodexApiBridge-win-x64.zip
          - rid: linux-x64
            archive: CodexApiBridge-linux-x64.tar.gz
          - rid: osx-x64
            archive: CodexApiBridge-osx-x64.tar.gz
          - rid: osx-arm64
            archive: CodexApiBridge-osx-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: >
          dotnet publish ./CodexApiBridge.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output artifacts/publish/${{ matrix.rid }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Include example config
        shell: bash
        run: cp bridge-config.example.json artifacts/publish/${{ matrix.rid }}/bridge-config.example.json

      - name: Pack Windows
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path "artifacts/publish/${{ matrix.rid }}/*" -DestinationPath "artifacts/${{ matrix.archive }}"

      - name: Pack Unix
        if: matrix.rid != 'win-x64'
        shell: bash
        run: tar -czf "artifacts/${{ matrix.archive }}" -C "artifacts/publish/${{ matrix.rid }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: artifacts/${{ matrix.archive }}

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Automated release for ${GITHUB_REF_NAME}." || true
          gh release upload "${GITHUB_REF_NAME}" "artifacts/${{ matrix.archive }}" --clobber
